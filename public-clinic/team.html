<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Website</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link href="/assets/css/style.css" rel="stylesheet" />

    <link rel="icon" href="assets/images/almez-logo.png" type="image/png" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.6.0/css/flag-icon.min.css"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  </head>

  <body>
    <!-- <div class="consultationFormShared"></div> -->
    <div class="headerShared"></div>
    <div class="navbarShared" style="position: sticky !important"></div>
    <div class="cookiesShared"></div>

    <header
      id="categoriesHeader"
      class="top-header py-2 bg-primary"
      style="
        position: sticky;
        top: 204px;
        background: #cdcdcd !important;
        color: #1b3b36;
      "
    >
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <div class="d-flex align-items-center">
            <h3 style="font-weight: 700" id="headerTitle" data-i18n="team">
              Team
            </h3>
            <br />
          </div>
          <div class="d-flex align-items-center">
            <h5 id="headerDescription" data-i18n="team">Team</h5>
            <br />
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <div id="categoriesSection" class="row mt-4">
        <!-- Categories will be loaded here -->
      </div>
    </div>
    <!-- Tooltip المخصص -->
    <div id="customTooltip">
      <div class="tooltip-inner">
        <!-- <img id="tooltipImage" src="" alt=""> -->
        <div class="tooltip-text">
          <!-- <h6 id="tooltipTitle"></h6> -->
          <p id="tooltipDesc"></p>
        </div>
      </div>
    </div>

    <div class="footerShared"></div>

    <!-- jQuery & Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/libs/i18next/i18next.min.js"></script>
    <script src="assets/libs/i18next/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="assets/libs/i18next/i18nextHttpBackend.min.js"></script>
    <!-- App Scripts -->
    <script src="assets/js/config.js"></script>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/cookies.js"></script>

    <script>
      $(document).ready(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const sectionId = urlParams.get("sectionId");

        if (sectionId) {
          if (typeof loadCategories === "function") {
            loadCategories(sectionId);
          } else {
            console.error(
              "Function loadCategories is not defined. Check if app.js is loaded.",
            );
          }
        } else {
          console.error("Section ID not found in URL");
        }
      });
    </script>
  </body>
</html>
